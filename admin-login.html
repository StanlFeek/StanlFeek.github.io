<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 - 淮北市实验高级中学选课系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-login-api="/api/admin/login" data-redirect="/console">
<div class="auth-page">
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="emblem">⚙</div>
        <h1>管理员登录</h1>
        <div class="sub" style="letter-spacing:1px; font-size:12px; color:var(--gray-500);">淮北市实验高级中学 · 体育课选课系统后台</div>
      </div>
      <div class="auth-error" id="auth-error"></div>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">管理员账号</label>
          <input class="input" id="username" name="username" autocomplete="username" placeholder="请输入管理员账号" maxlength="50">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="pwd-row">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="64">
            <button type="button" class="eye-btn" id="eye-btn" title="显示/隐藏密码">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">登 录</button>
      </form>
      <div class="auth-tip">
        <a href="/">← 返回学生登录页</a>
      </div>
    </div>
  </main>
  <footer class="auth-footer">淮北市实验高级中学 · 体育课选课系统</footer>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
