# Cloudflare Pages 项目配置
# 文档：https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "stanl-top"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# ── D1（浏览量 / 留言 / 友链申请）─────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "stanl-blog"
database_id = "883054b0-9b04-41a9-9d8f-05ddeeb027d8"

# ── KV（浏览量去重 + 接口限流）────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "0fc9d21e320f4858b50991b9a6656a79"

# ── R2（图片 / 相册）── 已决定不启用 ───────────────────────────
# 2026-11-10：明确不做相册，R2 不开通（不必绑支付方式）。
# 因此 /api/upload 与 /api/photos 固定返回 503，/api/health 里 r2 为 disabled。
# 将来若要相册：控制台 R2 → 开通 → `npx wrangler r2 bucket create stanl-images`
# → 取消下面三行注释 → R2 → stanl-images → Settings → Custom Domains 加 img.stanl.top。
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "stanl-images"

[vars]
SITE_NAME = "stanl.top"
