<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淮北市实验高级中学 - 体育课选课系统（演示版）</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="emblem" src="hbsg.jpg" alt="淮北市实验高级中学校徽">
        <h1>淮北市实验高级中学</h1>
        <div class="sub">体育课选课系统</div>
      </div>
      <div class="auth-error" id="auth-error"></div>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">用户名</label>
          <input class="input" id="username" name="username" autocomplete="username" placeholder="请输入用户名" maxlength="50">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="pwd-row">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="64">
            <button type="button" class="eye-btn" id="eye-btn" title="显示/隐藏密码">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">登 录</button>
      </form>
    </div>
  </main>
  <footer class="auth-footer">淮北市实验高级中学 · 体育课选课系统（演示版）</footer>
  <button class="admin-entry" id="admin-entry" type="button">⚙ 管理员入口</button>
</div>
<script src="js/common.js"></script>
<script src="js/store.js"></script>
<script src="js/login.js"></script>
</body>
</html>
